<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пульс виробництва</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f5fe3">
<style>
  /* Лише екран запуску й налаштування; саму панель малює той самий код, що й на ПК */
  :root { --bg: #f4f5f7; --surface: #fff; --ink: #14181f; --muted: #5b6472; --line: #dde1e7; --accent: #2f5fe3; --warn: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1116; --surface: #161b22; --ink: #e7ecf2; --muted: #9aa4b2; --line: #2a313b; --accent: #7aa2ff; --warn: #ff8a80; color-scheme: dark; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; }
  #boot .card { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: flex; flex-direction: column; gap: 12px; }
  #boot h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  #boot h1 img { width: 36px; height: 36px; border-radius: 8px; }
  #boot p { margin: 0; color: var(--muted); }
  #boot p.err { color: var(--warn); font-weight: 600; }
  #boot input { font: 14px ui-monospace, Menlo, Consolas, monospace; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
  #boot button { font: 600 15px system-ui, sans-serif; padding: 10px 16px; border-radius: 9px; border: 0; background: var(--accent); color: #fff; cursor: pointer; align-self: flex-start; }
  #boot .spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="boot"><div class="card"><h1><img src="icon-192.png" alt="">Пульс виробництва</h1><div class="spin"></div><p id="boot-msg">Завантажую…</p></div></div>
<script>
(function () {
  // Додаток «Пульс виробництва» для телефона: бере код панелі й останній знімок даних з Google-таблиці «Пульс — люди».
  // Знімок надсилає панель, відкрита на робочому ПК (кожні 5 хв, поки вона відкрита).
  var K = "puls-app-gs", KC = "puls-app-code", KS = "puls-app-snap";
  var RE = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
  var ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };
  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); };
  var setupWanted = /(^#|&)setup\b/.test(location.hash);
  // Адреса таблиці приходить у посиланні з панелі чи QR-коду (#u=…) і зберігається на телефоні
  var m = location.hash.match(/[#&]u=([^&]+)/);
  if (m) { var u0 = decodeURIComponent(m[1]); if (RE.test(u0)) ls.set(K, u0); }
  if (m || setupWanted) history.replaceState(null, "", location.pathname + location.search);
  var U = ls.get(K) || "";

  function card(html) {
    document.body.innerHTML = '<div id="boot"><div class="card"><h1><img src="icon-192.png" alt="">Пульс виробництва</h1>' + html + "</div></div>";
  }
  function fail(t) {
    card('<p class="err">' + esc(t) + '</p><button type="button" id="again">Спробувати ще</button>');
    document.getElementById("again").onclick = function () { location.reload(); };
  }
  function setup(note) {
    card((note ? '<p class="err">' + esc(note) + "</p>" : "") + "<p>Вставте адресу вебзастосунку з Google-таблиці «Пульс — люди» (закінчується на /exec). Простіше — відкрийте додаток за посиланням з панелі на ПК (⚙ → «Скопіювати посилання для телефона») або з QR-коду на сторінці встановлення: тоді адреса підставиться сама.</p>" + '<input id="gs" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(U) + '"><button type="button" id="save">Зберегти</button>');
    document.getElementById("save").onclick = function () {
      var v = document.getElementById("gs").value.trim();
      if (!RE.test(v)) return setup("Адреса має бути вигляду https://script.google.com/macros/s/…/exec");
      U = v; ls.set(K, v); location.reload();
    };
  }
  function get(a) {
    return fetch(U + "?a=" + a + "&t=" + Date.now()).then(function (r) {
      if (!r.ok) throw new Error("таблиця відповіла помилкою " + r.status);
      return r.text();
    });
  }
  // знімок: {ok, at, z} — z = gzip + base64
  function decode(txt) {
    var j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error(/<html/i.test(txt) ? "таблиця відповіла сторінкою входу — у розгортанні має бути доступ «Будь-хто»" : "незрозуміла відповідь таблиці"); }
    if (!j.ok) throw new Error(j.err || "таблиця не віддала дані");
    if (!j.z) return Promise.resolve(null);
    var bin = atob(j.z), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(ds).text().then(function (t) { return { at: j.at, d: JSON.parse(t) }; });
  }
  var cached = ls.get(KS), first = true;
  function fetchSnap() {
    if (first && cached) {
      // миттєвий старт з пам'яті телефона, потім свіжий знімок з таблиці
      first = false;
      var again = function () { var P = window.__pulseIG; if (!P) return; if (P.st.busy) return setTimeout(again, 300); P.refresh(true); };
      setTimeout(again, 300);
      return decode(cached);
    }
    first = false;
    return get("snap").then(function (txt) { var p = decode(txt); ls.set(KS, txt) || ls.set(KS, ""); return p; });
  }
  function start(code) {
    if (code.indexOf("__pulseIG") < 0) throw new Error("таблиця віддала не той код — онови Panel.gs в Apps Script і створи нову версію розгортання");
    window.__PULSE_VIEW = { url: U, fetchSnap: fetchSnap };
    document.getElementById("boot-msg") && (document.getElementById("boot-msg").textContent = "Готую панель…");
    (0, eval)(code);
  }

  if (!U || setupWanted) return setup();
  if (typeof DecompressionStream === "undefined") return fail("Цей браузер застарий для додатка — онови Chrome.");
  var c = ls.get(KC);
  if (c) {
    try { start(c); } catch (e) { c = null; }
    // оновлення коду панелі — у фоні; якщо змінився, перезапустити
    get("panel").then(function (code) { if (code.indexOf("__pulseIG") >= 0 && code !== c) { ls.set(KC, code); location.reload(); } }).catch(function () {});
  } else {
    get("panel").then(function (code) { ls.set(KC, code); start(code); }).catch(function (e) { fail("Не вдалося завантажити панель: " + (e.message || e)); });
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
</html>
